plugins { id 'com.android.application' }

android { namespace 'com.wassup.whatsapp'; compileSdk 35
    defaultConfig { applicationId 'com.wassup.whatsapp'; minSdk 23; targetSdk 35; versionCode 5; versionName '1.5'; buildConfigField 'String', 'APP_URL', '"' + (project.findProperty('APP_URL') ?: 'https://YOUR-VERCEL-APP.vercel.app/') + '"' }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'io.socket:socket.io-client:2.1.1'
}
