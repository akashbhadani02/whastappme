plugins { id 'com.android.application' }

android { namespace 'com.wassup.whatsapp'; compileSdk 35
    defaultConfig { applicationId 'com.wassup.whatsapp'; minSdk 23; targetSdk 35; versionCode 1; versionName '1.0'; buildConfigField 'String', 'APP_URL', '"' + (project.findProperty('APP_URL') ?: 'https://YOUR-VERCEL-APP.vercel.app/') + '"' }
}

dependencies { implementation 'androidx.appcompat:appcompat:1.7.0' }
