plugins { id 'com.android.application' }

android { namespace 'com.wassup.whatsapp'; compileSdk 35
    defaultConfig { applicationId 'com.wassup.whatsapp'; minSdk 23; targetSdk 35; versionCode 1; versionName '1.0'; def appUrl = project.findProperty('APP_URL') ?: ''
    if (!appUrl) throw new GradleException('APP_URL is required. Build with: ./gradlew assembleDebug -PAPP_URL=https://YOUR-DEPLOYED-DOMAIN/')
    buildConfigField 'String', 'APP_URL', '"' + appUrl + '"' }
}

dependencies { implementation 'androidx.appcompat:appcompat:1.7.0' }
